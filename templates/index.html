<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <h1>❤️ Heart Disease Prediction</h1>

        <p class="accuracy">
            Model Accuracy: {{ accuracy }}%
        </p>
        <div class="form-grid">

            <input type="number" id="age" placeholder="Age">

            <select id="sex">
                <option value="M">Male</option>
                <option value="F">Female</option>
            </select>

            <select id="chestPain">
                <option value="ATA">ATA</option>
                <option value="NAP">NAP</option>
                <option value="ASY">ASY</option>
                <option value="TA">TA</option>
                 </select>

            <input type="number" id="restingBP" placeholder="Resting BP">

            <input type="number" id="cholesterol" placeholder="Cholesterol">

            <select id="fastingBS">
                <option value="0">0</option>
                <option value="1">1</option>
            </select>
<select id="restingECG">
                <option value="Normal">Normal</option>
                <option value="ST">ST</option>
                <option value="LVH">LVH</option>
            </select>

            <input type="number" id="maxHR" placeholder="Max Heart Rate">

            <select id="exerciseAngina">
                <option value="Y">Yes</option>
                <option value="N">No</option>
            </select>

            <input type="number" step="0.1" id="oldpeak" placeholder="Old Peak">
<select id="stSlope">
                <option value="Up">Up</option>
                <option value="Flat">Flat</option>
                <option value="Down">Down</option>
            </select>

        </div>

        <button onclick="predictDisease()">
            Predict Disease
        </button>

        <div id="result"></div>
        </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
